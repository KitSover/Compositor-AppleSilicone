name: Build Mac App M4
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App via SPM
        run: |
          # Собираем проект напрямую через Swift Package Manager без участия Xcode-проекта
          swift build -c release --triple arm64-apple-macosx
          
          # Упаковываем скомпилированный бинарный файл в архив
          cd .build/arm64-apple-macosx/release/
          zip -r ../../../Compositor-M4.zip Compositor

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-M4-App
          path: Compositor-M4.zip
